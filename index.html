<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>L-PROSP — Verificador de Premiação de Motoristas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --red:#C8202F;
    --red-soft:#F5DADC;
    --blue:#1F3E8C;
    --blue-dark:#152A66;
    --blue-soft:#E4E9F7;
    --white:#FFFFFF;
    --green:#1E8A4C;
    --green-soft:#E1F3E8;
    --bg:#F3F5FA;
    --panel:#FFFFFF;
    --border:#D9DEEC;
    --text:#1B2340;
    --muted:#6A7290;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    padding:24px 20px 60px;
  }
  .wrap{max-width:1200px;margin:0 auto;}

  .hdr{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--white);border:1px solid var(--border);border-radius:10px;
    padding:14px 22px;margin-bottom:18px;flex-wrap:wrap;gap:14px;
    border-top:4px solid var(--red);
  }
  .hdr-left{display:flex;align-items:center;gap:16px;}
  .hdr-left img{height:56px;width:auto;}
  h1{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:22px;
    letter-spacing:0.4px;margin:0;text-transform:uppercase;color:var(--blue-dark);
  }
  .sub{color:var(--muted);font-size:12.5px;margin-top:2px;}

  .tabs{display:flex;gap:8px;margin-bottom:18px;}
  .tab-btn{
    background:var(--white);border:1px solid var(--border);color:var(--muted);
    padding:10px 20px;border-radius:8px;font-family:'Oswald',sans-serif;
    font-size:13px;text-transform:uppercase;letter-spacing:0.5px;cursor:pointer;font-weight:500;
  }
  .tab-btn.active{background:var(--blue);color:var(--white);border-color:var(--blue);}
  .tab{display:none;}
  .tab.active{display:block;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .add-driver{display:flex;gap:10px;flex:1;min-width:260px;}
  .add-driver input{
    flex:1;background:var(--white);border:1px solid var(--border);color:var(--text);
    padding:10px 12px;border-radius:6px;font-family:'Inter',sans-serif;font-size:14px;
  }
  .btn{
    border:none;padding:10px 18px;border-radius:6px;font-family:'Oswald',sans-serif;
    font-weight:600;text-transform:uppercase;font-size:12.5px;letter-spacing:0.4px;cursor:pointer;
  }
  .btn-blue{background:var(--blue);color:var(--white);}
  .btn-red{background:var(--red);color:var(--white);}
  .btn-outline{background:var(--white);color:var(--blue);border:1px solid var(--blue);}

  .panel{
    background:var(--panel);border:1px solid var(--border);border-radius:8px;
    padding:16px 20px;margin-bottom:18px;
  }
  .panel-title{
    font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:13px;
    letter-spacing:0.6px;color:var(--blue);margin:0 0 10px;
    display:flex;justify-content:space-between;align-items:center;cursor:pointer;
  }
  .panel-title .arrow{transition:transform .2s;color:var(--muted);font-size:11px;}
  .panel-body{display:none;}
  .panel.open .panel-body{display:block;}
  .panel.open .arrow{transform:rotate(90deg);}

  .cfg-section{margin-bottom:14px;}
  .cfg-section h4{
    font-family:'Oswald',sans-serif;font-size:12px;text-transform:uppercase;color:var(--red);
    letter-spacing:0.5px;margin:0 0 8px;border-top:1px solid var(--border);padding-top:10px;
  }
  .cfg-section:first-child h4{border-top:none;padding-top:0;}
  .cfg-row{display:grid;grid-template-columns:1fr 80px;gap:8px;align-items:center;margin-bottom:6px;}
  .cfg-row label{font-size:12.5px;}
  .cfg-row input{
    background:var(--bg);border:1px solid var(--border);color:var(--text);
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:6px 8px;border-radius:4px;width:100%;text-align:right;
  }

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;}
  .ticket{background:var(--white);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .ticket-hdr{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 16px;border-bottom:2px solid var(--blue-soft);background:var(--blue-soft);
  }
  .ticket-hdr input.name{
    background:transparent;border:none;color:var(--blue-dark);font-family:'Oswald',sans-serif;
    font-size:15px;font-weight:600;width:100%;
  }
  .remove{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;}
  .remove:hover{color:var(--red);}
  .icon-btn{background:none;border:none;color:var(--blue);cursor:pointer;font-size:14px;line-height:1;padding:2px 6px;}
  .icon-btn:hover{color:var(--blue-dark);}
  .ticket-actions{display:flex;align-items:center;gap:2px;}

  .total-line{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px 4px;}
  .score-num{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;color:var(--blue-dark);}
  .prize{font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;padding:5px 12px;border-radius:4px;}
  .prize.ok{background:var(--blue-soft);color:var(--blue);}
  .prize.zero{background:var(--red-soft);color:var(--red);}
  .gauge-track{
    position:relative;height:9px;background:var(--bg);border-radius:5px;overflow:hidden;
    border:1px solid var(--border);margin:0 16px 12px;
  }
  .gauge-fill{height:100%;border-radius:5px;transition:width .25s;background:var(--blue);}
  .gauge-fill.zero{background:var(--red);}

  .cat-block{padding:10px 16px;border-top:1px dashed var(--border);}
  .cat-block-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .cat-name{font-family:'Oswald',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:0.5px;color:var(--blue);}
  .cat-name.bonus{color:var(--green);}
  .cat-score{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--muted);}
  .cat-score.bonus{color:var(--green);}

  .field-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;}
  .field-row label{font-size:12.5px;flex:1;}
  .field-row input[type=number]{
    background:var(--bg);border:1px solid var(--border);color:var(--text);
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:5px 6px;border-radius:4px;width:64px;text-align:center;
  }
  .field-row .chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--red);}

  details.grupo-detail{margin-bottom:6px;}
  details.grupo-detail summary{
    cursor:pointer;font-size:12px;color:var(--text);padding:4px 0;
    display:flex;justify-content:space-between;
  }
  .grupo-body{padding:4px 0 6px 4px;}

  .critical-box{padding:10px 16px;border-top:1px dashed var(--border);background:#FFF8F8;}
  .crit-label{font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--red);font-family:'Oswald',sans-serif;margin-bottom:6px;}
  .crit-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:4px;}
  .crit-item input{accent-color:var(--red);}

  .summary-bar{
    display:flex;gap:24px;flex-wrap:wrap;margin-top:20px;padding:16px 20px;
    background:var(--white);border:1px solid var(--border);border-radius:8px;border-top:3px solid var(--blue);
  }
  .summary-item .num{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:var(--blue-dark);}
  .summary-item .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}
  .empty{color:var(--muted);font-size:13px;padding:30px;text-align:center;border:1px dashed var(--border);border-radius:8px;background:var(--white);}

  /* history */
  .hist-empty{color:var(--muted);font-size:13px;padding:30px;text-align:center;border:1px dashed var(--border);border-radius:8px;background:var(--white);}
  .hist-month{background:var(--white);border:1px solid var(--border);border-radius:8px;margin-bottom:14px;overflow:hidden;}
  .hist-month-hdr{
    background:var(--blue);color:var(--white);padding:10px 18px;font-family:'Oswald',sans-serif;
    text-transform:uppercase;letter-spacing:0.5px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .hist-month-hdr .hist-actions{display:flex;gap:6px;}
  .hist-month-hdr .hist-actions button{
    background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.4);color:var(--white);
    padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .hist-month-hdr .hist-actions button:hover{background:rgba(255,255,255,0.3);}
  table.hist-table{width:100%;border-collapse:collapse;font-size:13px;}
  table.hist-table th{
    text-align:left;background:var(--blue-soft);color:var(--blue-dark);padding:8px 14px;
    font-family:'Oswald',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:0.4px;
  }
  table.hist-table td{padding:8px 14px;border-top:1px solid var(--border);}
  table.hist-table td.prize-ok{color:var(--blue);font-weight:600;}
  table.hist-table td.prize-zero{color:var(--red);font-weight:600;}
  table.hist-table input{
    width:100%;font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:4px 6px;
    border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);
  }

  /* modal */
  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(21,42,102,0.55);z-index:100;
    align-items:center;justify-content:center;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:var(--white);border-radius:10px;padding:22px 24px;width:340px;max-width:90vw;
    border-top:4px solid var(--red);
  }
  .modal-box h3{font-family:'Oswald',sans-serif;font-size:16px;color:var(--blue-dark);margin:0 0 12px;text-transform:uppercase;}
  .modal-box p{font-size:13px;color:var(--muted);margin:0 0 14px;}
  .modal-box input[type=text]{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:6px;
    font-family:'Inter',sans-serif;font-size:14px;margin-bottom:14px;
  }
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;}

  /* toast */
  .toast{
    position:fixed;bottom:22px;right:22px;background:var(--blue-dark);color:var(--white);
    padding:12px 18px;border-radius:8px;font-size:13px;z-index:200;opacity:0;pointer-events:none;
    transition:opacity .25s;box-shadow:0 4px 14px rgba(0,0,0,0.2);
  }
  .toast.show{opacity:1;}

  /* print */
  #printArea{display:none;}
  @media print{
    body{padding:0;}
    .wrap, .modal-overlay, .toast{display:none !important;}
    #printArea{display:block;padding:0;}
    #printArea h2{font-family:'Oswald',sans-serif;color:var(--blue-dark);}
    #printArea table{width:100%;border-collapse:collapse;margin-top:10px;}
    #printArea th,#printArea td{border:1px solid #999;padding:6px 10px;font-size:12px;text-align:left;}
    #printArea th{background:#eee;}
    @page{margin:12mm;}
  }
</style>
</head>

  </div>
</div>

<div class="toast" id="toast"></div>

<div id="printArea"></div>

<script>
// ---------------- CONFIG ----------------
const CONFIG = {
  velocidade: {
    max: 500,
    bands: [ {maxOcc:10, loss:100}, {maxOcc:20, loss:200}, {maxOcc:30, loss:300} ]
  },
  media: {
    max: 500,
    thresholds: [ {min:3.0, pts:500}, {min:2.8, pts:300}, {min:2.6, pts:200}, {min:2.4, pts:100} ]
  },
  grupos: [
    { key:'documentos', label:'Documentos', max:250, itens:[
        {key:'atrasoDoc', label:'Atraso envio CTE/comprovante (por dia)', loss:25},
        {key:'docErrado', label:'Documento errado/incompleto', loss:50}
    ]},
    { key:'veiculo', label:'Cuidado com o veículo', max:250, itens:[
        {key:'semChecklist', label:'Falta de checklist diário', loss:25},
        {key:'danoNegligencia', label:'Danos por negligência', loss:125}
    ]},
    { key:'prazos', label:'Compromisso com prazos', max:250, itens:[
        {key:'atrasoPrazo', label:'Atraso sem justificativa', loss:50},
        {key:'faltaComunic', label:'Falta de comunicação', loss:50}
    ]},
    { key:'comunicacao', label:'Comunicação com a empresa', max:250, itens:[
        {key:'naoAtende', label:'Não atender contato importante', loss:25},
        {key:'semStatus', label:'Falta de atualização de status', loss:25}
    ]}
  ],
  critical: [
    {key:'multaGrave', label:'Multa grave ou gravíssima'},
    {key:'acidenteImprudencia', label:'Acidente por imprudência'},
    {key:'usoIndevido', label:'Uso indevido do veículo'},
    {key:'descumprimento', label:'Descumprimento de norma interna importante'}
  ]
};

let drivers = [];
let history = [];
let idCounter = 1;

function allItemKeys(){
  const keys = [];
  CONFIG.grupos.forEach(g => g.itens.forEach(i => keys.push(i.key)));
  return keys;
}

function newDriver(name){
  const occ = {};
  allItemKeys().forEach(k => occ[k] = 0);
  const crit = {};
  CONFIG.critical.forEach(c => crit[c.key] = false);
  return {id: idCounter++, name: name || 'Motorista', velOcc:0, velOver100:false, media:0, occ, crit};
}

function velScore(driver){
  if(driver.velOver100) return 0;
  const occ = driver.velOcc;
  if(occ <= 0) return CONFIG.velocidade.max;
  const bands = CONFIG.velocidade.bands;
  for(const b of bands){
    if(occ <= b.maxOcc) return CONFIG.velocidade.max - b.loss;
  }
  return 0; // acima da última faixa = perde tudo
}

function mediaScore(driver){
  const v = driver.media;
  const th = CONFIG.media.thresholds; // ordenado do maior pro menor min
  for(const t of th){
    if(v >= t.min) return t.pts;
  }
  return 0;
}

function grupoScore(driver, grupo){
  let score = grupo.max;
  grupo.itens.forEach(it => { score -= (driver.occ[it.key]||0) * it.loss; });
  return Math.max(0, score);
}

function computeTotal(driver){
  let total = velScore(driver) + mediaScore(driver);
  CONFIG.grupos.forEach(g => total += grupoScore(driver, g));
  total = Math.min(2000, Math.max(0, total));
  const critical = CONFIG.critical.some(c => driver.crit[c.key]);
  return { total, critical, prize: critical ? 0 : total };
}

// ---------------- RENDER ----------------
function togglePanel(id){ document.getElementById(id).classList.toggle('open'); }

function showTab(tab){
  document.getElementById('tabSim').classList.toggle('active', tab==='sim');
  document.getElementById('tabHist').classList.toggle('active', tab==='hist');
  document.getElementById('tabBtnSim').classList.toggle('active', tab==='sim');
  document.getElementById('tabBtnHist').classList.toggle('active', tab==='hist');
  if(tab==='hist') renderHistory();
}

function renderWeightPanel(){
  let html = '';
  html += `<div class="cfg-section"><h4>Velocidade (máx. 500 pts)</h4>`;
  CONFIG.velocidade.bands.forEach((b,i) => {
    html += `<div class="cfg-row"><label>Até ${b.maxOcc} passagens acima do limite → perde</label>
      <input type="number" value="${b.loss}" onchange="updateVelBand(${i},this.value)"></div>`;
  });
  html += `<div class="cfg-row"><label>Passou de 100 km/h uma vez → perde os 500 pts direto</label><input value="500" disabled></div>`;
  html += `</div>`;

  html += `<div class="cfg-section"><h4>Média mensal (máx. 500 pts)</h4>`;
  CONFIG.media.thresholds.slice().reverse().forEach((t) => {
    const idx = CONFIG.media.thresholds.indexOf(t);
    html += `<div class="cfg-row"><label>Média ≥ ${t.min.toFixed(1)} → ganha</label>
      <input type="number" value="${t.pts}" onchange="updateMediaThreshold(${idx},this.value)"></div>`;
  });
  html += `</div>`;

  CONFIG.grupos.forEach(g => {
    html += `<div class="cfg-section"><h4>${g.label} (máx. ${g.max} pts)</h4>`;
    g.itens.forEach(it => {
      html += `<div class="cfg-row"><label>${it.label}</label>
        <input type="number" value="${it.loss}" onchange="updateItemLoss('${it.key}',this.value)"></div>`;
    });
    html += `</div>`;
  });

  document.getElementById('weightBody').innerHTML = html;
}

function updateVelBand(i, val){ CONFIG.velocidade.bands[i].loss = parseFloat(val)||0; renderDrivers(); }
function updateMediaThreshold(i, val){ CONFIG.media.thresholds[i].pts = parseFloat(val)||0; renderDrivers(); }
function updateItemLoss(key, val){
  CONFIG.grupos.forEach(g => { const it = g.itens.find(x=>x.key===key); if(it) it.loss = parseFloat(val)||0; });
  renderDrivers();
}

function addDriver(){
  const input = document.getElementById('newName');
  const name = input.value.trim();
  if(!name) return;
  drivers.push(newDriver(name));
  input.value = '';
  renderDrivers();
}
function removeDriver(id){ drivers = drivers.filter(d => d.id !== id); renderDrivers(); }
function renameDriver(id, val){ const d = drivers.find(x=>x.id===id); d.name = val; scheduleSave(); }

function updateVelOcc(id, val){ const d = drivers.find(x=>x.id===id); d.velOcc = Math.max(0, parseInt(val)||0); renderDrivers(); }
function updateVelOver(id, checked){ const d = drivers.find(x=>x.id===id); d.velOver100 = checked; renderDrivers(); }
function updateMedia(id, val){ const d = drivers.find(x=>x.id===id); d.media = Math.max(0, parseFloat(val)||0); renderDrivers(); }
function updateOcc(id, key, val){ const d = drivers.find(x=>x.id===id); d.occ[key] = Math.max(0, parseInt(val)||0); renderDrivers(); }
function updateCrit(id, key, checked){ const d = drivers.find(x=>x.id===id); d.crit[key] = checked; renderDrivers(); }

function renderDrivers(){
  const grid = document.getElementById('driversGrid');
  const empty = document.getElementById('emptyMsg');
  const summary = document.getElementById('summaryBar');

  if(drivers.length === 0){
    grid.innerHTML = '';
    empty.style.display = 'block';
    summary.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  summary.style.display = 'flex';

  grid.innerHTML = drivers.map(driver => {
    const { total, critical, prize } = computeTotal(driver);
    const vScore = velScore(driver);
    const mScore = mediaScore(driver);
    const pct = (total/2000)*100;
    const zeroClass = (critical || prize===0) ? 'zero' : '';

    const critHtml = CONFIG.critical.map(c => `
      <div class="crit-item">
        <input type="checkbox" id="crit-${driver.id}-${c.key}" ${driver.crit[c.key]?'checked':''}
          onchange="updateCrit(${driver.id},'${c.key}',this.checked)">
        <label for="crit-${driver.id}-${c.key}">${c.label}</label>
      </div>`).join('');

    const gruposHtml = CONFIG.grupos.map(g => {
      const gScore = grupoScore(driver, g);
      const itensHtml = g.itens.map(it => `
        <div class="field-row">
          <label>${it.label} (-${it.loss})</label>
          <input type="number" min="0" value="${driver.occ[it.key]}" onchange="updateOcc(${driver.id},'${it.key}',this.value)">
        </div>`).join('');
      return `
        <details class="grupo-detail">
          <summary><span>${g.label}</span><span style="color:var(--muted)">${gScore}/${g.max}</span></summary>
          <div class="grupo-body">${itensHtml}</div>
        </details>`;
    }).join('');

    return `
    <div class="ticket">
      <div class="ticket-hdr">
        <input class="name" value="${driver.name}" onchange="renameDriver(${driver.id}, this.value)">
        <div class="ticket-actions">
          <button class="icon-btn" title="Imprimir individual" onclick="printDriverReport(${driver.id})">🖨️</button>
          <button class="remove" onclick="removeDriver(${driver.id})">✕</button>
        </div>
      </div>

      <div class="total-line">
        <span class="score-num">${critical ? '—' : total}</span>
        <span class="prize ${prize>0?'ok':'zero'}">${prize>0 ? 'R$ ' + prize.toLocaleString('pt-BR') : 'Sem prêmio'}</span>
      </div>
      <div class="gauge-track"><div class="gauge-fill ${zeroClass}" style="width:${pct}%"></div></div>

      <div class="cat-block">
        <div class="cat-block-hdr">
          <span class="cat-name">Velocidade</span>
          <span class="cat-score">${vScore}/500</span>
        </div>
        <div class="field-row">
          <label>Passagens acima do limite no mês</label>
          <input type="number" min="0" value="${driver.velOcc}" onchange="updateVelOcc(${driver.id},this.value)">
        </div>
        <div class="field-row chk">
          <input type="checkbox" id="over100-${driver.id}" ${driver.velOver100?'checked':''}
            onchange="updateVelOver(${driver.id},this.checked)">
          <label for="over100-${driver.id}">Passou de 100 km/h alguma vez</label>
        </div>
      </div>

      <div class="cat-block">
        <div class="cat-block-hdr">
          <span class="cat-name bonus">Média mensal (bônus)</span>
          <span class="cat-score bonus">${mScore}/500</span>
        </div>
        <div class="field-row">
          <label>Média informada</label>
          <input type="number" step="0.1" min="0" value="${driver.media}" onchange="updateMedia(${driver.id},this.value)">
        </div>
      </div>

      <div class="cat-block">
        <div class="cat-block-hdr">
          <span class="cat-name">Outros itens</span>
          <span class="cat-score">${CONFIG.grupos.reduce((s,g)=>s+grupoScore(driver,g),0)}/1000</span>
        </div>
        ${gruposHtml}
      </div>

      <div class="critical-box">
        <div class="crit-label">Regras críticas (zeram o prêmio inteiro)</div>
        ${critHtml}
      </div>
    </div>`;
  }).join('');

  renderSummary();
  scheduleSave();
}

function renderSummary(){
  const results = drivers.map(d => computeTotal(d));
  const total = results.length;
  const withPrize = results.filter(r => r.prize > 0).length;
  const withoutPrize = total - withPrize;
  const totalPayout = results.reduce((s,r) => s + r.prize, 0);
  const avgScore = total ? (results.reduce((s,r) => s + (r.critical?0:r.total), 0) / total).toFixed(0) : 0;

  document.getElementById('summaryBar').innerHTML = `
    <div class="summary-item"><div class="num">${total}</div><div class="lbl">Motoristas</div></div>
    <div class="summary-item"><div class="num" style="color:var(--blue)">${withPrize}</div><div class="lbl">Recebem prêmio</div></div>
    <div class="summary-item"><div class="num" style="color:var(--red)">${withoutPrize}</div><div class="lbl">Sem prêmio</div></div>
    <div class="summary-item"><div class="num">R$ ${totalPayout.toLocaleString('pt-BR')}</div><div class="lbl">Custo total do mês</div></div>
    <div class="summary-item"><div class="num">${avgScore}</div><div class="lbl">Pontuação média</div></div>
  `;
}

// ---------------- MODAL / TOAST ----------------
function openModal(title, text, placeholder, defaultVal, onConfirm){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  const input = document.getElementById('modalInput');
  input.style.display = '';
  input.placeholder = placeholder || '';
  input.value = defaultVal || '';
  document.getElementById('modalOverlay').classList.add('open');
  const btn = document.getElementById('modalConfirmBtn');
  const newBtn = btn.cloneNode(true);
  btn.parentNode.replaceChild(newBtn, btn);
  newBtn.onclick = () => { onConfirm(input.value); closeModal(); };
  input.focus();
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ---------------- RESET / HISTORY ----------------
function resetMonth(){
  if(drivers.length === 0){ showToast('Adicione motoristas antes de fechar o mês.'); return; }
  openModal('Fechar mês', 'Informe o nome do mês que está sendo fechado.', 'Ex: Junho 2026', '', (label) => {
    const entries = drivers.map(d => {
      const { total, critical, prize } = computeTotal(d);
      return { name: d.name, score: critical ? 0 : total, prize, critical };
    });
    history.unshift({
      label: (label||'').trim() || `Mês ${history.length+1}`,
      savedAt: new Date().toLocaleDateString('pt-BR'),
      entries
    });
    drivers.forEach(d => {
      d.velOcc = 0; d.velOver100 = false; d.media = 0;
      allItemKeys().forEach(k => d.occ[k] = 0);
      CONFIG.critical.forEach(c => d.crit[c.key] = false);
    });
    renderDrivers();
    renderHistory();
    showToast(`Mês "${(label||'').trim() || 'sem nome'}" salvo no histórico. Pontuações zeradas para o novo mês.`);
  });
}

function deleteMonth(idx){
  openModal('Excluir mês', `Excluir "${history[idx].label}" do histórico? Essa ação não pode ser desfeita.`, '', '', () => {
    history.splice(idx,1);
    renderHistory();
    showToast('Mês excluído do histórico.');
  });
  document.getElementById('modalInput').style.display = 'none';
}

function editMonthLabel(idx, val){ history[idx].label = val; scheduleSave(); }
function editEntryScore(idx, eIdx, val){
  const e = history[idx].entries[eIdx];
  e.score = Math.max(0, parseInt(val)||0);
  if(!e.critical) e.prize = e.score;
  scheduleSave();
}
function editEntryCritical(idx, eIdx, checked){
  const e = history[idx].entries[eIdx];
  e.critical = checked;
  e.prize = checked ? 0 : e.score;
  renderHistory();
}

function renderHistory(){
  const el = document.getElementById('histContainer');
  if(history.length === 0){
    el.innerHTML = `<div class="hist-empty">Nenhum mês fechado ainda. Use "Resetar mês" no simulador para salvar a pontuação atual aqui e começar um novo mês.</div>`;
    scheduleSave();
    return;
  }
  el.innerHTML = history.map((month, idx) => {
    const rows = month.entries.map((e, eIdx) => `
      <tr>
        <td>${e.name}</td>
        <td><input type="number" min="0" value="${e.score}" onchange="editEntryScore(${idx},${eIdx},this.value)"></td>
        <td>
          <label style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--red);">
            <input type="checkbox" style="width:auto;" ${e.critical?'checked':''} onchange="editEntryCritical(${idx},${eIdx},this.checked)"> crítico
          </label>
        </td>
        <td class="${e.prize>0?'prize-ok':'prize-zero'}">${e.prize>0 ? 'R$ '+e.prize.toLocaleString('pt-BR') : 'Sem prêmio'}</td>
        <td><button class="icon-btn" title="Imprimir individual" onclick="printHistoryDriverReport(${idx},${eIdx})">🖨️</button></td>
      </tr>`).join('');
    const totalPayout = month.entries.reduce((s,e)=>s+e.prize,0);
    return `
      <div class="hist-month">
        <div class="hist-month-hdr">
          <input value="${month.label}" onchange="editMonthLabel(${idx},this.value)"
            style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.4);color:var(--white);padding:4px 8px;border-radius:4px;font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:13px;flex:1;min-width:140px;">
          <span style="font-size:11px;">Salvo em ${month.savedAt} · Total: R$ ${totalPayout.toLocaleString('pt-BR')}</span>
          <div class="hist-actions">
            <button onclick="printMonthReport(${idx})">🖨️ Imprimir</button>
            <button onclick="deleteMonth(${idx})">✕ Excluir</button>
          </div>
        </div>
        <table class="hist-table">
          <thead><tr><th>Motorista</th><th>Pontuação</th><th>Crítico</th><th>Prêmio</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }).join('');
  scheduleSave();
}

// ---------------- IMPRESSÃO ----------------
function printDriverReport(id){
  const d = drivers.find(x => x.id === id);
  if(!d) return;
  const { total, critical, prize } = computeTotal(d);

  const velRows = `<tr><td>Passagens acima do limite</td><td>${d.velOcc}</td><td>${velScore(d)}/500</td></tr>
    ${d.velOver100 ? '<tr><td colspan="2">Passou de 100 km/h</td><td style="color:#C8202F;">Zera os 500 pts</td></tr>' : ''}`;

  const mediaRows = `<tr><td>Média informada</td><td>${d.media}</td><td>${mediaScore(d)}/500</td></tr>`;

  const gruposRows = CONFIG.grupos.map(g => {
    const itens = g.itens.map(it => `<tr><td style="padding-left:20px;">${it.label}</td><td>${d.occ[it.key]}</td><td>-${d.occ[it.key]*it.loss}</td></tr>`).join('');
    return `<tr><td colspan="2"><b>${g.label}</b></td><td><b>${grupoScore(d,g)}/${g.max}</b></td></tr>${itens}`;
  }).join('');

  const critRows = CONFIG.critical.map(c => `<tr><td colspan="2">${c.label}</td><td>${d.crit[c.key] ? 'SIM — zera o prêmio' : 'Não'}</td></tr>`).join('');

  document.getElementById('printArea').innerHTML = `
    <h2>L-PROSP — Justificativa de pontuação</h2>
    <p>Motorista: <b>${d.name}</b> · Gerado em ${new Date().toLocaleString('pt-BR')}</p>
    <table>
      <thead><tr><th>Item</th><th>Ocorrências</th><th>Pontos</th></tr></thead>
      <tbody>
        <tr><td colspan="2"><b>Velocidade</b></td><td><b>${velScore(d)}/500</b></td></tr>
        ${velRows}
        <tr><td colspan="2"><b>Média mensal (bônus)</b></td><td><b>${mediaScore(d)}/500</b></td></tr>
        ${mediaRows}
        ${gruposRows}
        <tr><td colspan="2"><b>Regras críticas</b></td><td></td></tr>
        ${critRows}
        <tr><td colspan="2" style="font-size:14px;"><b>PONTUAÇÃO FINAL</b></td><td style="font-size:14px;"><b>${critical ? 'Regra crítica' : total}</b></td></tr>
        <tr><td colspan="2" style="font-size:14px;"><b>PRÊMIO</b></td><td style="font-size:14px;"><b>${prize>0 ? 'R$ '+prize.toLocaleString('pt-BR') : 'Sem prêmio'}</b></td></tr>
      </tbody>
    </table>
    <div style="margin-top:70px;width:320px;text-align:center;">
      <div style="border-top:1px solid #333;padding-top:6px;">Assinatura Motorista</div>
    </div>`;
  window.print();
}

function printHistoryDriverReport(idx, eIdx){
  const month = history[idx];
  const e = month.entries[eIdx];
  document.getElementById('printArea').innerHTML = `
    <h2>L-PROSP — Justificativa de pontuação</h2>
    <p>Motorista: <b>${e.name}</b> · Mês: <b>${month.label}</b> (fechado em ${month.savedAt})</p>
    <table>
      <thead><tr><th>Item</th><th>Valor</th></tr></thead>
      <tbody>
        <tr><td>Pontuação final</td><td>${e.critical ? 'Regra crítica' : e.score}</td></tr>
        <tr><td>Prêmio</td><td>${e.prize>0 ? 'R$ '+e.prize.toLocaleString('pt-BR') : 'Sem prêmio'}</td></tr>
      </tbody>
    </table>
    <div style="margin-top:70px;width:320px;text-align:center;">
      <div style="border-top:1px solid #333;padding-top:6px;">Assinatura Motorista</div>
    </div>`;
  window.print();
}

function printCurrentStatus(){
  if(drivers.length === 0){ showToast('Nenhum motorista cadastrado.'); return; }
  const rows = drivers.map(d => {
    const { total, critical, prize } = computeTotal(d);
    return `<tr>
      <td>${d.name}</td>
      <td>${velScore(d)}/500</td>
      <td>${mediaScore(d)}/500</td>
      <td>${CONFIG.grupos.reduce((s,g)=>s+grupoScore(d,g),0)}/1000</td>

      <thead><tr><th>Motorista</th><th>Velocidade</th><th>Média (bônus)</th><th>Outros itens</th><th>Pontuação</th><th>Prêmio</th></tr></thead>
      <tbody>${rows}</tbody>

}

function printMonthReport(idx){
  const month = history[idx];
  const rows = month.entries.map(e => `<tr>
      <td>${e.name}</td>
      <td>${e.critical ? 'Regra crítica' : e.score}</td>
      <td>${e.prize>0 ? 'R$ '+e.prize.toLocaleString('pt-BR') : 'Sem prêmio'}</td>
    </tr>`).join('');
  const totalPayout = month.entries.reduce((s,e)=>s+e.prize,0);
  document.getElementById('printArea').innerHTML = `
    <h2>L-PROSP — Relatório geral: ${month.label}</h2>
    <p>Mês fechado em ${month.savedAt} · Custo total: R$ ${totalPayout.toLocaleString('pt-BR')}</p>
    <table>
      <thead><tr><th>Motorista</th><th>Pontuação</th><th>Prêmio</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  window.print();
}

function renderAll(){
  renderWeightPanel();
  renderDrivers();
  renderHistory();
}

  return {
    velBands: CONFIG.velocidade.bands.map(b => b.loss),
    mediaThresholds: CONFIG.media.thresholds.map(t => t.pts),
    itemLoss: Object.fromEntries(CONFIG.grupos.flatMap(g => g.itens.map(it => [it.key, it.loss])))
  };
}
function applyConfig(saved){
  if(!saved) return;
  (saved.velBands||[]).forEach((loss,i) => { if(CONFIG.velocidade.bands[i]) CONFIG.velocidade.bands[i].loss = loss; });
  (saved.mediaThresholds||[]).forEach((pts,i) => { if(CONFIG.media.thresholds[i]) CONFIG.media.thresholds[i].pts = pts; });
  CONFIG.grupos.forEach(g => g.itens.forEach(it => {
    if(saved.itemLoss && saved.itemLoss[it.key] != null) it.loss = saved.itemLoss[it.key];
  }));
}

function scheduleSave(){
  if(!cloudReady || applyingRemote) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    firebase.database().ref('lprosp/state').set({
      config: serializeConfig(),
      drivers, history, idCounter
    }).catch(err => console.warn('Falha ao salvar na nuvem', err));
  }, 500);
}

try{
  if(firebaseConfig.apiKey !== "SEU_API_KEY_AQUI"){
    firebase.initializeApp(firebaseConfig);
    const ref = firebase.database().ref('lprosp/state');
    ref.on('value', snap => {
      const data = snap.val();
      applyingRemote = true;
      if(data){
        applyConfig(data.config);
        if(Array.isArray(data.drivers)) drivers = data.drivers;
        if(Array.isArray(data.history)) history = data.history;
        if(data.idCounter) idCounter = data.idCounter;
      }
      renderAll();
      applyingRemote = false;
      cloudReady = true;
    });
  } else {
    console.warn('Firebase não configurado — rodando apenas localmente neste navegador.');
    renderAll();
  }
}catch(e){
  console.warn('Firebase indisponível, rodando apenas localmente.', e);
  renderAll();
}
</script>
